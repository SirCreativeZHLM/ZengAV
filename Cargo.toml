[package]
name = "zengav"
version = "0.1.0"
edition = "2021"
description = "No-bloat antivirus: scan the computer, check files or folders"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
walkdir = "2"
rayon = "1"
dirs = "5"
memmap2 = "0.9.12"
ureq = "2"
yara-x = "1.22.0"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }
