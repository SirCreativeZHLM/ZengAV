name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - {os: macos-latest,   target: aarch64-apple-darwin,      name: zengav-macos-arm64,   ext: tar.gz}
          - {os: macos-latest,   target: x86_64-apple-darwin,       name: zengav-macos-x64,     ext: tar.gz}
          - {os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: zengav-linux-x64,     ext: tar.gz}
          - {os: windows-latest, target: x86_64-pc-windows-msvc,    name: zengav-windows-x64,   ext: zip}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          tar -C target/${{ matrix.target }}/release -czf ${{ matrix.name }}.tar.gz zengav
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256
      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/zengav.exe -DestinationPath ${{ matrix.name }}.zip
          (Get-FileHash ${{ matrix.name }}.zip -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.name }}.zip" | Out-File -Encoding ascii ${{ matrix.name }}.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.name }}.${{ matrix.ext }}
            ${{ matrix.name }}.${{ matrix.ext }}.sha256
