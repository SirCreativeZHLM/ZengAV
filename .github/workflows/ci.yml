name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  LINUX_DEPS: libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - name: Command line builds without the window
        run: cargo build --release --no-default-features

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - {os: macos-latest,   target: aarch64-apple-darwin,     name: ZengAV-macos-arm64,   kind: mac}
          - {os: macos-latest,   target: x86_64-apple-darwin,      name: ZengAV-macos-x64,     kind: mac}
          - {os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, name: ZengAV-linux-x64,     kind: linux}
          - {os: windows-latest, target: x86_64-pc-windows-msvc,   name: ZengAV-windows-x64,   kind: windows}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package (macOS app bundle)
        if: matrix.kind == 'mac'
        run: |
          B=target/${{ matrix.target }}/release
          mkdir -p dist/ZengAV.app/Contents/MacOS dist/ZengAV.app/Contents/Resources
          cp $B/zengav-gui dist/ZengAV.app/Contents/MacOS/ZengAV
          cp $B/zengav dist/zengav
          cp packaging/Info.plist dist/ZengAV.app/Contents/Info.plist
          cp packaging/ZengAV.icns dist/ZengAV.app/Contents/Resources/ZengAV.icns
          codesign --force --deep --sign - dist/ZengAV.app
          (cd dist && zip -qry ../${{ matrix.name }}.zip ZengAV.app zengav)
          shasum -a 256 ${{ matrix.name }}.zip > ${{ matrix.name }}.zip.sha256
      - name: Package (Linux)
        if: matrix.kind == 'linux'
        run: |
          B=target/${{ matrix.target }}/release
          mkdir -p dist/ZengAV
          cp $B/zengav-gui dist/ZengAV/ZengAV
          cp $B/zengav dist/ZengAV/zengav
          cp packaging/zengav.desktop packaging/zengav.png dist/ZengAV/
          tar -C dist -czf ${{ matrix.name }}.tar.gz ZengAV
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256
      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $B = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force dist/ZengAV | Out-Null
          Copy-Item "$B/zengav-gui.exe" "dist/ZengAV/ZengAV.exe"
          Copy-Item "$B/zengav.exe" "dist/ZengAV/zengav.exe"
          Compress-Archive -Path dist/ZengAV -DestinationPath ${{ matrix.name }}.zip
          (Get-FileHash ${{ matrix.name }}.zip -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.name }}.zip" | Out-File -Encoding ascii ${{ matrix.name }}.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.name }}.*
